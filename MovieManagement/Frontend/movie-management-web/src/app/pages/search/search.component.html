<h2>Search Movies</h2>

<div>
  <label>
    <input type="radio" name="criteria"
      [(ngModel)]="criteria" value="title">
    Title
  </label>

  <label>
    <input type="radio" name="criteria"
      [(ngModel)]="criteria" value="genre">
    Genre
  </label>

  <label>
    <input type="radio" name="criteria"
      [(ngModel)]="criteria" value="year">
    Year
  </label>
</div>

<br>

<input
  [(ngModel)]="searchValue"
  placeholder="Enter search value">

<br><br>

<button (click)="search()" style="font-size:20px; margin-right:10px;">Search</button>

<button (click)="gotToHome() " style="font-size:20px;">
  Back
</button>
