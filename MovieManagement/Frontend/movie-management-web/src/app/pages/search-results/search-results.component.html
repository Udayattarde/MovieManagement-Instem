<h2>Search Results</h2>

<ngx-loading
  [show]="loading"
  [config]="{
    backdropBorderRadius: '3px',
    fullScreenBackdrop: true,
    primaryColour: '#ffffff',
    backdropBackgroundColour: 'rgba(0,0,0,0.6)'
  }">
</ngx-loading>

<div *ngIf=" !loading &&  movies.length===0">
  No movies found
</div>

<div style="display:flex; flex-wrap:wrap; gap:20px;">

  <div *ngFor="let m of movies"
       style="margin-left:10px;width:30%;
              border:1px solid #ccc;
              padding:10px;
              box-sizing:border-box;">

    <img [src]="m.imageUrl"
         width="100%"
         height="220"
         style="object-fit:cover"
         (error)="m.imageUrl='assets/No_Poster_Img.png'">

    <h3>{{m.title}}</h3>
    <p>Year: {{m.year}}</p>
    <p>Genre: {{m.genre}}</p>

    <a [routerLink]="['/details',m.id]">
      View Details
    </a>

  </div>

</div>
