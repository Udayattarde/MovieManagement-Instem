<h2>Search Results</h2>

<ngx-loading
  [show]="loading"
  [config]="{
    backdropBorderRadius: '3px',
    fullScreenBackdrop: true,
    primaryColour: '#ffffff',
    backdropBackgroundColour: 'rgba(0,0,0,0.6)'
  }">
</ngx-loading>

<div *ngIf=" !loading &&  movies.length===0">
  No movies found
</div>

<div *ngFor="let m of movies" style="border:1px solid #ccc;margin:10px;padding:10px">
 <img [src]="m.imageUrl" width="120"
  height="160"
  (error)="m.imageUrl = 'assets/No_Poster_Img.png'"
 >
  <h3>{{m.title}}</h3>
  <p>Year: {{m.year}}</p>
  <p>Genre: {{m.genre}}</p>

  <a [routerLink]="['/details',m.id]">
    View Details
  </a>

</div>
